name: tests

on:
  pull_request:
  push:
    branches: [ main, develop ]
  # The release workflow calls this one as its gate: nothing is built or
  # published until both jobs pass.
  workflow_call:

jobs:
  unit:
    name: Tests (Linux, Python 3.11)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev libegl1 libxkbcommon0 libgl1-mesa-dri xvfb
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: |
          xvfb-run -a python -m pytest -q tests/
      - name: Run eval harness guards (no model)
        env:
          EVAL_LLM_PROVIDER: ollama
          EVAL_LLM_BASE_URL: ""
        run: |
          python -m pytest -q evals/test_evals_keep_the_core_out_of_the_repository.py
      # Imports every eval without running one, so an eval broken at import
      # time (a renamed helper, a moved module) fails here. It says nothing
      # about the evals' behaviour: running them takes a model.
      - name: Collect the evals (import check, no model)
        env:
          EVAL_LLM_PROVIDER: ollama
          EVAL_LLM_BASE_URL: ""
          EVAL_JUDGE_BASE_URL: http://127.0.0.1:9
        run: |
          python -m pytest evals --collect-only -q

  windows:
    name: Tests (Windows, Python 3.11)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m pytest -q tests/
      - name: Run eval harness guards (no model)
        env:
          EVAL_LLM_PROVIDER: ollama
          EVAL_LLM_BASE_URL: ""
        run: |
          python -m pytest -q evals/test_evals_keep_the_core_out_of_the_repository.py
      - name: Collect the evals (import check, no model)
        env:
          EVAL_LLM_PROVIDER: ollama
          EVAL_LLM_BASE_URL: ""
          EVAL_JUDGE_BASE_URL: http://127.0.0.1:9
        run: |
          python -m pytest evals --collect-only -q
